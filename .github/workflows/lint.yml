name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency-gate:
    name: uspicks_lint consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the drift linter
        run: python3 scripts/uspicks_lint.py --root .
